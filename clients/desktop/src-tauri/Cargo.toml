[package]
name = "rommancer-desktop"
version = "0.3.0"
description = "Rommancer companion: syncs SD cards and folders with a Rommancer server"
edition = "2021"

[lib]
name = "rommancer_desktop_lib"
# Desktop only: the cdylib of the mobile template breaks the Windows (mingw) link
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
sha1_smol = "1"
sysinfo = { version = "0.37", default-features = false, features = ["disk", "system"] }
base64 = "0.22"
urlencoding = "2"
anyhow = "1"
tauri-plugin-notification = "2"
roxmltree = "0.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# Small and lean: the app mostly sits in the tray
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

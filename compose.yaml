name: rommancer

services:
  mysql:
    image: docker.io/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3317}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Containerfile
    restart: unless-stopped
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      DATA_DIR: /data
      SEED_DIR: /seed
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data:/data
      # Seed: DATs, RetroAchievements and scraping exported from another instance
      - ./seed:/seed
      # Rom folders: mounted as-is and registered in the app as /roms/...
      - ${ROMS_DIR:-./roms}:/roms

  web:
    build:
      context: .
      dockerfile: frontend/Containerfile
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mysql-data:

name: rommancer

services:
  mysql:
    # MySQL with passwords of its own, generated on the first start into ./data/secrets (deploy/mysql)
    build:
      context: .
      dockerfile: deploy/mysql/Containerfile
    image: localhost/rommancer-mysql:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3317}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data/secrets:/secrets
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Containerfile
    restart: unless-stopped
    profiles: ["full"]
    environment:
      DATA_DIR: /data
      SEED_DIR: /seed
      # The installer offers this database as the recommended one
      ROMMANCER_BUNDLED_DB: mysql:3306
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data:/data
      # Seed: DATs, RetroAchievements and scraping exported from another instance
      - ./seed:/seed
      # Rom folders: mounted as-is and registered in the app as /roms/...
      - ${ROMS_DIR:-./roms}:/roms

  web:
    build:
      context: .
      dockerfile: frontend/Containerfile
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mysql-data:
